name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build debug APK with Rust core
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirLyrics-arm64-v8a
          path: app/build/outputs/apk/debug/*.apk

      - name: Prepare Release Asset and Notes
        run: |
          mkdir -p release-assets
          TAG_NAME="${GITHUB_REF_NAME:-v1.2.7-patch}"
          cp app/build/outputs/apk/debug/*.apk "release-assets/AirLyrics-${TAG_NAME}-arm64-v8a.apk"
          cat << 'EOF' > release_notes.md
          ### AirLyrics 自定义构建版本

          - 通知监听改为按需绑定：仅在主界面可见或悬浮歌词运行时保持连接，离开后约 5 秒自动解绑
          - 多任务划掉卡片后不再残留"通知侦听器"常驻进程；开机或被系统拉起时也会自行解绑
          - 无需重新授予通知使用权，再次打开应用即自动恢复
          EOF

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ -z "$TAG_NAME" ] || [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            TAG_NAME="v1.2.7-patch"
          fi
          gh release create "$TAG_NAME" release-assets/*.apk \
            --title "AirLyrics $TAG_NAME" \
            --notes-file release_notes.md
